name: Production smoke

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surfaces:
    runs-on: ubuntu-24.04
    steps:
      - name: API health
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://freightpilot-api.freightpilot.workers.dev/health \
            | tee /tmp/freightpilot-health.json
          python3 - <<'PY'
          import json

          with open('/tmp/freightpilot-health.json', encoding='utf-8') as handle:
              health = json.load(handle)
          assert health['db'] == 'ok', health
          if health.get('schema') is None:
              # Deploy the schema-aware health check before enforcing this gate.
              print('Schema revision unavailable: deploy the updated API.')
              raise SystemExit(1)
          assert health['status'] == 'ok', health
          assert health['schema'] == 'current', health
          assert health['revision'] == health['expected_revision'], health
          assert health['revision'] == '20261122_0027', health
          PY

      - name: API schema revision endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://freightpilot-api.freightpilot.workers.dev/api/v1/health/schema \
            | python3 -c "import json,sys; schema=json.load(sys.stdin); assert schema == {'status': 'current', 'current': '20261122_0027', 'expected': '20261122_0027'}, schema"

      - name: Public surfaces
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://freightpilot.pages.dev/ > /dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://freightpilot-ops.pages.dev/ > /dev/null

      - name: Dispatch fleet endpoint is published
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://freightpilot-api.freightpilot.workers.dev/openapi.json \
            | python3 -c "import json,sys; schema=json.load(sys.stdin); assert '/api/v1/dispatch/plan-fleet' in schema['paths']"

      - name: Security headers are published
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --dump-header /tmp/freightpilot-web-headers.txt \
            https://freightpilot.pages.dev/ > /dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --dump-header /tmp/freightpilot-ops-headers.txt \
            https://freightpilot-ops.pages.dev/ > /dev/null
          python3 - <<'PY'
          from pathlib import Path

          for path in (
              '/tmp/freightpilot-web-headers.txt',
              '/tmp/freightpilot-ops-headers.txt',
          ):
              headers = Path(path).read_text(encoding='utf-8').lower()
              for name in (
                  'content-security-policy:',
                  'x-content-type-options: nosniff',
                  'x-frame-options: deny',
                  'strict-transport-security:',
              ):
                  assert name in headers, (path, name)
          PY

      - name: API security headers are published
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --dump-header /tmp/freightpilot-api-headers.txt \
            https://freightpilot-api.freightpilot.workers.dev/health > /dev/null
          python3 - <<'PY'
          from pathlib import Path

          headers = Path('/tmp/freightpilot-api-headers.txt').read_text(encoding='utf-8').lower()
          for name in (
              'content-security-policy:',
              'x-content-type-options: nosniff',
              'x-frame-options: deny',
              'strict-transport-security:',
              'cache-control: no-store',
          ):
              assert name in headers, name
          PY

      - name: Legacy addresses redirect to current sites
        run: |
          for url in \
            https://freightpilot.freightpilot.workers.dev/ \
            https://freightpilot-ops.freightpilot.workers.dev/login; do
            test "$(curl --fail --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --output /dev/null --write-out '%{http_code}' \
              "$url")" = "301"
          done
          legacy_product_headers="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --dump-header - --output /dev/null \
            https://freightpilot.freightpilot.workers.dev/)"
          legacy_console_headers="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --dump-header - --output /dev/null \
            https://freightpilot-ops.freightpilot.workers.dev/login)"
          test "$(printf '%s\n' "$legacy_product_headers" | tr -d '\r' | \
            awk -F ': ' 'tolower($1) == "location" { print $2 }')" = \
            "https://freightpilot.pages.dev/"
          test "$(printf '%s\n' "$legacy_console_headers" | tr -d '\r' | \
            awk -F ': ' 'tolower($1) == "location" { print $2 }')" = \
            "https://freightpilot-ops.pages.dev/login"
