[project]
name = "freightpilot-api-worker"
version = "0.1.0"
description = "FreightPilot FastAPI service on Cloudflare Python Workers"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=43.0.0",
  "fastapi<0.142",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pg8000>=1.30.0",
  "pydantic-settings>=2.3.0",
  "PyJWT>=2.15.0",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.30",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]

[tool.pywrangler]
bundle = false
find_additional_modules = true
